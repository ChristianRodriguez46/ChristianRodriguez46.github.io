# Runs Breakaway's site checks on every push and pull request.
# Breakaway lives in its own repo and appears here as a git submodule at Projects/Breakaway.
# The checks read this site's pages (nav links, the Projects page, the homepage tile), so they run
# here, with the submodule checked out. The game's own tests run in the Breakaway repo.
# It doesn't deploy anything: GitHub Pages still publishes the site from the branch as before.
name: breakaway-site-checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  site-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm run test:site
        working-directory: Projects/Breakaway
