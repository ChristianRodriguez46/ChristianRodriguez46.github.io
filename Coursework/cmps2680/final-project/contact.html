<!doctype html>
<html>
    <head>
        <title>Contact</title>
        <!--bootstrap-->
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet"> 
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>

        <!--Jquery-->
        <script src="https://code.jquery.com/jquery-3.6.4.min.js"></script>
        <!--scipt and Css-->
        <script src="./contact.js"></script>
        <link rel='stylesheet' type='text/css' href="./styles/contact.css">
    </head>

    <body>
        <nav class="navbar naxvbar-expand-sm bg-dark navbar-dark">
            <div class="container-fluid" id="navContainer">
                <a class="navbar-brand" href="./home.html">Wise Choice Detailing</a>
                <button class="navbar-toggler collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#xx" style="cursor:pointer" fdprocessedid="kwg44" aria-expanded="false">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="navbar-collapse collapse" id="xx" style="">
                    <ul class="navbar-nav" id="navList">

                        <li class="nav-item">
                            <a class="nav-link" href="./home.html">Home</a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link" href="./service.html">Services</a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link" href="./booking.html">Book your detailing</a>
                        </li>    

                        <li class="nav-item">
                            <a class="nav-link" href="./gallery.html">Gallery</a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link" href="./contact.html">Contact Us</a>
                        </li>
                    </ul>

                    <form role="search">
                        <input class="form-control" type="search" placeholder="Search" aria-label="Search">
                    </form>
                </div>
            </div>
        </nav>
        <h1 id="c-header"> CONTACT US</h1>
        <div id="container">
            <!--Contact form-->
            <div id="form">
                <!--Personal information-->
                <form id="personalInforForm" class="c-form" method="get">
                    <fieldset>
                        <input type="text" id="fname" name="fname" placeholder="Full Name" required="">
                        <br>

                        <input type="text" id="email" name="email" placeholder="Email" required="">
                    </fieldset>
                </form>
                <!--Message impact-->
                <form class="c-form" method="post">
                    <fieldset>
                        <textarea name="message" cols="5" id="message" placeholder="Message" required="" spellcheck="false"></textarea>
                        <br>
                    </fieldset>
                </form>

                <div class="button_container">
                    <button id="submitForms" class="button">Contact Me</button>
                </div>

                <div id="c_output"></div>
                <!--Quick info to instagram-->
                <div id="info">
                    <div id="logo">

                        <img src="./media/logo.JPG" class="rounded-circle" width="95px" height="auto">

                        <a href="https://www.instagram.com/wise_choice_detailingg/">
                            <img src="./media/insta_logo.png" width="45px" height="45px">
                        </a>
                    </div>
                </div>
            </div>
        </div>

        <footer class="py-3 my-4">
            <ul class="nav justify-content-center border-bottom pb-3 mb-3">
                <li class="nav-item"><a href="./home.html" class="nav-link px-2 text-body-secondary">Home</a></li>
                <li class="nav-item"><a href="./service.html" class="nav-link px-2 text-body-secondary">Services</a></li>
                <li class="nav-item"><a href="./booking.html" class="nav-link px-2 text-body-secondary">Booking</a></li>
                <li class="nav-item"><a href="./gallery.html" class="nav-link px-2 text-body-secondary">Gallery</a></li>
                <li class="nav-item"><a href="./contact.html" class="nav-link px-2 text-body-secondary">Contact Us</a></li>
            </ul>

            <p class="text-center text-body-secondary"> &copy; 2023 Wise Choice Detailing. All rights reserved.</p>

        </footer>
    </body>
</html>
