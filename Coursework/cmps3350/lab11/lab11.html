<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Christian’s App Store</title>
  <link href="https://fonts.googleapis.com/css?family=Roboto:400,500&display=swap" rel="stylesheet">
  <style>
    /* Reset */
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Roboto', sans-serif;
      background: linear-gradient(135deg, #1a2a6c, #b21f1f, #fdbb2d);
      color: #333;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 1rem;
    }

    .store-card {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.2);
      overflow: hidden;
      max-width: 600px;
      width: 100%;
      transition: transform 0.3s ease;
    }
    .store-card:hover { transform: translateY(-5px); }

    .store-header {
      background: #00695c;
      color: #fff;
      padding: 1rem;
      text-align: center;
    }
    .store-header h1 { font-weight: 500; font-size: 1.75rem; }

    .store-body {
      display: flex;
      flex-wrap: wrap;
      padding: 1rem;
      gap: 1rem;
    }
    .store-image {
      flex: 1 1 200px;
      text-align: center;
    }
    .store-image img {
      max-width: 100%;
      border-radius: 8px;
    }

    .store-info {
      flex: 2 1 300px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .store-info p { margin-bottom: 0.75rem; }

    .download-btn {
      display: inline-block;
      margin-top: 1rem;
      padding: 0.75rem 1.5rem;
      background: #00695c;
      color: #fff;
      text-decoration: none;
      font-weight: 500;
      border-radius: 6px;
      transition: background 0.2s ease;
    }
    .download-btn:hover { background: #00897b; }
  </style>
</head>
<body>
  <div class="store-card">
    <header class="store-header">
      <h1>Christian’s App</h1>
    </header>
    <div class="store-body">
      <div class="store-image">
        <!-- Image uses a map named "appmap" -->
        <img src="./images/spirit3.png"
             usemap="#appmap"
             alt="Christian’s App preview">
      </div>
      <div class="store-info">
        <p>
          • Starts with a simple “Hello, World!” on launch.<br>
          • Tap the button to replace it with your own name.<br>
          • Each tap also shows a temporary popup with your name.<br>
          • Swipe downward (half‑screen) to close the app instantly.
        </p>
        <a href="./myapp.apk" class="download-btn">
          Download Christian’s APK
        </a>
      </div>
    </div>
  </div>

  <!-- Define clickable area over the image -->
  <map name="appmap">
    <!-- Adjust coords to match your actual image dimensions -->
    <area shape="rect"
          coords="20,20,260,460"
          href="./myapp.apk"
          title="Install Christian’s App"
          alt="Install Christian’s App">
  </map>
</body>
</html>
